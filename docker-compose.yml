# =============================================================================
# VNLRAG — local data-service foundation (VNLRAG-36)
# =============================================================================
# Local development data services. Do not expose these ports in production.
# =============================================================================

name: vnlaw-rag

x-service-hardening: &service-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    container_name: vnlaw-postgres
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - target: 5432
        published: 5432
        host_ip: 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [vnlaw-network]

  qdrant:
    <<: *service-hardening
    image: qdrant/qdrant:v1.19.0
    ports:
      - target: 6333
        published: 6333
        host_ip: 127.0.0.1
      - target: 6334
        published: 6334
        host_ip: 127.0.0.1
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [vnlaw-network]

  redis:
    container_name: vnlaw-redis
    image: redis:8.10.0
    ports:
      - target: 6379
        published: 6379
        host_ip: 127.0.0.1
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vnlaw-network]

  minio:
    <<: *service-hardening
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKETS: ${MINIO_BUCKETS:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rm -f /tmp/minio-buckets-ready
        minio server /data --console-address ":9001" &
        minio_pid=$$!
        cleanup() { kill "$$minio_pid" 2>/dev/null || true; wait "$$minio_pid" 2>/dev/null || true; }
        trap cleanup INT TERM EXIT
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          kill -0 "$$minio_pid" 2>/dev/null || exit 1
          sleep 1
        done
        for bucket in $$(printf '%s' "$$MINIO_BUCKETS" | tr ',' ' '); do mc mb --ignore-existing "local/$$bucket"; done
        touch /tmp/minio-buckets-ready
        wait "$$minio_pid"
    ports:
      - target: 9000
        published: 9000
        host_ip: 127.0.0.1
      - target: 9001
        published: 9001
        host_ip: 127.0.0.1
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-buckets-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [vnlaw-network]

networks:
  vnlaw-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:
  redis_data:
  minio_data:
