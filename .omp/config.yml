modelRoleStorage: project

modelRoles:
  default: openai-codex/gpt-5.6-luna:medium
  smol: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-luna:medium
  plan: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-luna:high
  vision: openai-codex/gpt-5.6-luna:low
  designer: openai-codex/gpt-5.6-luna:medium
  advisor: openai-codex/gpt-5.6-luna:low
providers:
  openai-codex:
    codeMode: auto
textVerbosity: low
defaultThinkingLevel: medium
compaction:
  asyncEnabled: false
  keepRecentTokens: 12000
  methodOrder:
    - remote
    - snapcompact
    - shake
    - soft
tools:
  approvalMode: yolo
  intentTracing: false
  xdevDocs: catalog
grep:
  enabled: false
glob:
  enabled: false
astGrep:
  enabled: false
advisor:
  enabled: false
  syncBacklog: 1
  immuneTurns: 5

debug:
  enabled: true

skills:
  includeSkills:
    - verification-before-completion
    - simplify
    - code-review
    - codebase-design
    - diagnosing-bugs
    - domain-modeling
    - resolving-merge-conflicts
    - tdd
    - ui-ux-pro-max