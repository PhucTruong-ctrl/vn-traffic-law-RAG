  designer: openai-codex/gpt-5.6-luna:medium
  advisor: openai-codex/gpt-5.6-luna:low
providers:
  openai-codex:
    codeMode: auto
textVerbosity: medium
defaultThinkingLevel: high
compaction:
  asyncEnabled: false
  keepRecentTokens: 16000
  methodOrder:
    - remote
    - snapcompact
    - shake
    - soft
tools:
  approvalMode: yolo
  intentTracing: true
  xdevDocs: catalog
  abortOnFabricatedResult: true
grep:
  enabled: true
