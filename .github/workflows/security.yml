name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate hardened compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose syntax
        run: docker compose --env-file .env.example config --quiet
      - name: Assert security controls
        run: |
          docker compose --env-file .env.example config > /tmp/compose-config.yml
          grep -Fqx '    read_only: true' /tmp/compose-config.yml
          grep -Fqx '    cap_drop:' /tmp/compose-config.yml
          grep -Fqx '      - ALL' /tmp/compose-config.yml
          grep -Fqx '      - no-new-privileges:true' /tmp/compose-config.yml
          grep -Fqx '    internal: true' /tmp/compose-config.yml
  backend-security:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_security.py -q --no-cov
