# GitHub Actions CI — clean-env gate for backend + frontend.
#
# Mirrors the local pre-PR checks (doc 07 §7.11.1):
#   backend  : uv sync --locked → ruff check/format → mypy → pytest (unit suite)
#   frontend : npm ci → tsc --noEmit → next build
#   commitlint: PR commit messages (same config/hook used by .husky/commit-msg)
#
# Design notes:
#   - `uv sync --locked` is the clean-environment check that catches
#     lockfile/dependency drift (e.g. the MinerU/transformers breakage).
#   - Heavy real-tool tests are marked `integration` and excluded from the
#     default unit suite: the real-conversion Docling tests (9 tests running
#     the real DocumentConverter on the fixture PDFs, ~70-80s total) plus the
#     MinerU real-pipeline test (CLI + model download). They only run in the
#     opt-in `integration-tests` job via workflow_dispatch.
#   - mypy runs with `--exclude 'observability'`: app/observability has 4
#     pre-existing type errors (langfuse_client.py x2, skeleton.py x2) that
#     predate this workflow. Excluding them at the CI step keeps CI green
#     without touching that code or the shared [tool.mypy] config.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (uv sync / ruff / mypy / pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CPU-only paths for docling/mineru (github runners have no GPU).
      CUDA_VISIBLE_DEVICES: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked deps (clean-env check)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy, excl. pre-existing observability errors)
        run: uv run mypy app --exclude 'observability'

      - name: Unit tests (integration-marked tests excluded)
        run: uv run pytest tests/ -q --no-cov -m "not integration"

  # Opt-in only: real Docling conversion + MinerU pipeline (model downloads).
  integration-tests:
    name: Integration tests (opt-in, workflow_dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    env:
      MINERU_INTEGRATION: "1"
      CUDA_VISIBLE_DEVICES: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked deps (clean-env check)
        run: uv sync --locked

      - name: Integration tests
        run: uv run pytest tests/ -q --no-cov -m integration

  frontend:
    name: Frontend (npm ci / typecheck / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked deps
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Build (next build)
        run: npm run build

  commitlint:
    name: Commit messages (commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so base.sha is available to commitlint --from.
          fetch-depth: 0

      - name: Install Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # commitlint + config-conventional live in frontend/node_modules.
      - name: Install commitlint deps
        run: npm ci
        working-directory: frontend

      # Same invocation as .husky/commit-msg, scoped to the PR's commits.
      # `npm exec --prefix frontend --no --` (not `npx --prefix`) is used because
      # it resolves the binary from frontend/node_modules portably across npm
      # 10 (node 20, CI) and npm 12 (local), and is not shadowed by PATH aliases.
      - name: Lint PR commit messages
        run: npm exec --prefix frontend --no -- commitlint --config commitlint.config.mjs --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
