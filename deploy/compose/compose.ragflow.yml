# RAGFlow benchmark-only profile (VNLRAG-142).
# Never combine with the release stack or production ingestion.
name: vnlaw-ragflow-benchmark

services:
  mysql:
    image: mysql:8.0
    profiles: [ragflow]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragflow-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_flow}
      MYSQL_USER: ${MYSQL_USER:-ragflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragflow}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    profiles: [ragflow]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:latest
    profiles: [ragflow]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragflow-minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [ragflow]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ragflow}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  ragflow:
    image: infiniflow/ragflow:v0.26.4
    container_name: vnlaw-ragflow
    profiles: [ragflow]
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAGFLOW_WEB_PORT:-8088}:80"
      - "127.0.0.1:${RAGFLOW_API_PORT:-9380}:9380"
    environment:
      RAGFLOW_API_HOST: ${RAGFLOW_API_HOST:-0.0.0.0}
      RAGFLOW_API_PORT: ${RAGFLOW_API_PORT:-9380}
      API_PROXY_SCHEME: python
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DBNAME: ${MYSQL_DATABASE:-rag_flow}
      MYSQL_USER: ${MYSQL_USER:-ragflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragflow}
      ES_HOST: elasticsearch
      ES_PORT: 9200
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_ROOT_USER:-ragflow}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragflow-minio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ragflow}
    volumes:
      - ragflow_data:/ragflow
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:80/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  ragflow_data:
  mysql_data:
  elasticsearch_data:
  minio_data:
  redis_data:
