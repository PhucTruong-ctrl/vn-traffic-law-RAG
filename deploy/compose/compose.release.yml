# VNLRAG production release stack.
# Acceptance: docker compose -f deploy/compose/compose.release.yml config
# requires all secret variables and must be followed by health checks; no credentials are committed.
# Secrets are supplied through an untracked root .env; none are committed here.
name: vnlaw-rag

services:
  postgres:
    read_only: false
    security_opt: []
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnlaw}
      POSTGRES_USER: ${POSTGRES_USER:-vnlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [vnlaw-network]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks: [vnlaw-network]

  redis:
    read_only: false
    security_opt: []
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    image: redis:8.10.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    networks: [vnlaw-network]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks: [vnlaw-network]

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: vnlaw-backend:${APP_VERSION:-dev}
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli.ensure_qdrant_collection && python -m app.cli.ensure_buckets"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vnlaw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vnlaw}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      APP_ENV: ${APP_ENV:-release}
    networks: [vnlaw-network]
    depends_on:
      postgres: {condition: service_started}
      qdrant: {condition: service_started}
      minio: {condition: service_started}

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: vnlaw-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vnlaw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vnlaw}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      APP_ENV: ${APP_ENV:-release}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    networks: [vnlaw-network]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    image: vnlaw-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "dramatiq", "app.workers"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vnlaw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vnlaw}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      APP_ENV: ${APP_ENV:-release}
    networks: [vnlaw-network]
    depends_on:
      migrate: {condition: service_completed_successfully}

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        APP_VERSION: ${APP_VERSION:-dev}
    image: vnlaw-frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      APP_VERSION: ${APP_VERSION:-dev}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    networks: [vnlaw-network]
    depends_on:
      backend: {condition: service_started}

networks:
  vnlaw-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:
  redis_data:
  minio_data:
