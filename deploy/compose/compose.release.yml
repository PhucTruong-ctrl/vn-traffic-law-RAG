name: vnlaw-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: vnlaw-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      APP_ENV: ${APP_ENV:-release}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      qdrant: {condition: service_healthy}

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        APP_VERSION: ${APP_VERSION:-dev}
    image: vnlaw-frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend: {condition: service_healthy}

volumes:
  qdrant_data:
