<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luồng tạo dữ liệu pháp luật</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .code { fill: #2d3142; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .arrow-label { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.3 MANIFEST, MARKDOWN VÀ JSONL</p>
  <h1>Luồng tạo dữ liệu: manifest và Markdown đến chunks JSONL</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-ingestion-pipeline-title ch2-ingestion-pipeline-desc">
    <title id="ch2-ingestion-pipeline-title">Luồng tạo dữ liệu pháp luật</title>
    <desc id="ch2-ingestion-pipeline-desc">Hệ thống đọc manifest và các file Markdown, kiểm tra đường dẫn, tính SHA-256, tạo chunk rồi ghi mỗi chunk thành một dòng trong chunks.jsonl.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors: orthogonal, drawn before nodes. -->
    <path d="M240 136 H272 Q280 136 280 144 V216 Q280 224 288 224 H336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M240 328 H288 Q296 328 296 320 V248 Q296 240 304 240 H336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="496" y1="232" x2="552" y2="232" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="712" y1="232" x2="768" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Labels with clear connector gaps. -->
    <rect x="500" y="188" width="48" height="16" rx="4" fill="#f5f5f5"/>
    <text x="524" y="200" class="arrow-label" text-anchor="middle">CHIA CHUNK</text>
    <rect x="716" y="196" width="48" height="16" rx="4" fill="#f5f5f5"/>
    <text x="740" y="208" class="arrow-label" text-anchor="middle">GHI DÒNG</text>

    <!-- Manifest input -->
    <g>
      <rect x="64" y="72" width="176" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="64" y="72" width="176" height="128" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="80" y="96" class="tag">JSON</text>
      <text x="152" y="124" class="name" text-anchor="middle">manifest.json</text>
      <text x="80" y="148" class="sub">document_id · số hiệu</text>
      <text x="80" y="172" class="sub">tên văn bản</text>
      <text x="80" y="192" class="sub">tên file Markdown</text>
    </g>

    <!-- Markdown input -->
    <g>
      <rect x="64" y="264" width="176" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="64" y="264" width="176" height="128" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="80" y="288" class="tag">MARKDOWN</text>
      <text x="152" y="316" class="name" text-anchor="middle">Tập Markdown</text>
      <text x="80" y="344" class="sub">Văn bản pháp luật cục bộ</text>
      <text x="80" y="368" class="sub">manifest chỉ định file</text>
    </g>

    <!-- Load + validate -->
    <g>
      <rect x="328" y="168" width="168" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="328" y="168" width="168" height="128" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="344" y="192" class="tag">LOAD + VALIDATE</text>
      <text x="412" y="224" class="name" text-anchor="middle">Đọc và kiểm tra</text>
      <text x="344" y="252" class="sub">Đọc JSON · mở file .md</text>
      <text x="344" y="276" class="sub">Kiểm tra file thuộc corpus</text>
    </g>

    <!-- Chunk and hash focal -->
    <g>
      <rect x="552" y="168" width="160" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="552" y="168" width="160" height="128" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="568" y="192" class="tag">PROCESS</text>
      <text x="632" y="224" class="name" text-anchor="middle">Tạo chunk</text>
      <text x="568" y="248" class="sub">page_content</text>
      <text x="568" y="268" class="sub">+ metadata</text>
      <text x="568" y="288" class="sub">+ SHA-256 nguồn</text>
    </g>

    <!-- JSONL output -->
    <g>
      <rect x="768" y="152" width="160" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="768" y="152" width="160" height="160" rx="8" fill="rgba(45,49,66,.03)" stroke="#2e5aa8"/>
      <text x="784" y="176" class="tag">JSONL</text>
      <text x="848" y="208" class="name" text-anchor="middle">chunks.jsonl</text>
      <text x="784" y="232" class="sub">Mỗi dòng = một chunk</text>
      <text x="784" y="256" class="code">{ chunk_id,</text>
      <text x="784" y="276" class="code">  page_content,</text>
      <text x="784" y="296" class="code">  content_sha256 }</text>
    </g>

    <!-- Why JSONL / hash -->
    <rect x="336" y="352" width="376" height="112" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399"/>
    <text x="352" y="376" class="tag">JSONL</text>
    <text x="352" y="404" class="sub">Có thể đọc từng dòng và kiểm tra diff.</text>
    <text x="352" y="428" class="sub">Pipeline không phải nạp toàn bộ file.</text>
    <text x="352" y="452" class="sub">SHA-256 phát hiện thay đổi nhưng không thay thế chữ ký số.</text>

    <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="536" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="520" width="20" height="16" rx="4" fill="#fff" stroke="#2d3142"/>
    <text x="164" y="532" class="legend">ĐẦU VÀO / XỬ LÝ</text>
    <rect x="336" y="520" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="368" y="532" class="legend">TẠO CHUNK + HASH</text>
    <rect x="544" y="520" width="20" height="16" rx="4" fill="rgba(45,49,66,.03)" stroke="#2e5aa8"/>
    <text x="576" y="532" class="legend">DỮ LIỆU JSONL</text>
  </svg>
</main>
</body>
</html>
