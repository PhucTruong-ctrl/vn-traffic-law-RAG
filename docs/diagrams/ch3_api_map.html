<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ endpoint API</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#2d3142;font-family:'Be Vietnam Pro',sans-serif}.page{width:min(960px,100%);margin:auto;padding:32px 40px 24px}.eyebrow{margin:0 0 8px;color:#4f5d75;font-size:8px;letter-spacing:.16em;font-weight:500}h1{margin:0 0 24px;font-size:28px;line-height:1.15;font-weight:500}svg{display:block;width:100%;height:auto}.group{fill:#fff;stroke:rgba(45,49,66,.22);stroke-width:1}.focus{fill:#fff1eb;stroke:#eb6c36;stroke-width:1.2}.name{fill:#2d3142;font-size:16px;font-weight:600}.body{fill:#2d3142;font-size:12px}.sub{fill:#4f5d75;font-size:8px;font-weight:500;letter-spacing:.08em}.route{fill:#2e5aa8;font-size:10px;font-weight:500}.note{fill:#4f5d75;font-size:9px}.legend{fill:#4f5d75;font-size:8px;letter-spacing:.1em}.footer{margin-top:16px;border-top:1px solid rgba(45,49,66,.14);padding-top:10px;color:#4f5d75;font-size:10px}
</style></head>
<body><main class="page"><p class="eyebrow">CHƯƠNG 3 · API</p><h1>Bản đồ endpoint và nhóm chức năng API</h1>
<svg viewBox="0 0 960 640" role="img" aria-labelledby="api-map-title api-map-desc">
<title id="api-map-title">Bản đồ endpoint API</title><desc id="api-map-desc">Các endpoint FastAPI hiện có được gom theo chat, xác thực, phiên và bookmark, nguồn pháp luật cùng health.</desc>
<defs><marker id="api-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="api-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
<rect width="960" height="640" fill="#f5f5f5"/>
<!-- arrows first -->
<path d="M160 296 H196 Q204 296 204 304 V344 Q204 352 212 352" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#api-link)"/>
<path d="M160 296 H188 Q196 296 196 288 V184 Q196 176 204 176" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#api-link)"/>
<path d="M160 296 H188 Q196 296 196 408 V488 Q196 496 204 496" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#api-link)"/>
<!-- client --> <rect x="48" y="264" width="112" height="64" rx="6" fill="#e8ebf0" stroke="#4f5d75"/><text x="104" y="288" text-anchor="middle" class="sub">CLIENT</text><text x="104" y="308" text-anchor="middle" class="name">Trình duyệt</text>
<!-- groups -->
<rect x="212" y="124" width="320" height="104" rx="6" class="focus"/><text x="228" y="148" class="sub">AUTH</text><text x="228" y="172" class="name">Xác thực</text><text x="228" y="194" class="route">POST /api/v1/auth/register</text><text x="228" y="210" class="route">POST /api/v1/auth/login</text><text x="404" y="194" class="route">GET /api/v1/auth/me</text>
<rect x="212" y="264" width="320" height="176" rx="6" class="group"/><text x="228" y="288" class="sub">CHAT</text><text x="228" y="312" class="name">Hỏi đáp</text><text x="228" y="336" class="route">POST /api/v1/chat</text><text x="228" y="356" class="route">GET /api/v1/chats</text><text x="228" y="376" class="route">POST /api/v1/chats</text><text x="228" y="396" class="route">GET · PATCH · DELETE /api/v1/chats/{session_id}</text><text x="228" y="416" class="route">POST /api/v1/chats/{session_id}/messages</text>
<rect x="212" y="476" width="320" height="136" rx="6" class="group"/><text x="228" y="500" class="sub">SESSION · MESSAGE · BOOKMARK</text><text x="228" y="522" class="route">POST /api/v1/chats/{session_id}/messages/</text><text x="228" y="538" class="route">{message_id}/feedback</text><text x="228" y="556" class="route">GET /api/v1/bookmarks</text><text x="228" y="572" class="route">GET /api/v1/bookmarks/{assistant_message_id}/status</text><text x="228" y="588" class="route">POST /api/v1/bookmarks/{session_id}</text><text x="228" y="604" class="route">DELETE /api/v1/bookmarks/{assistant_message_id}</text>
<rect x="592" y="124" width="320" height="176" rx="6" class="group"/><text x="608" y="148" class="sub">LEGAL</text><text x="608" y="172" class="name">Nguồn pháp luật</text><text x="608" y="196" class="route">GET /api/v1/legal-documents</text><text x="608" y="216" class="route">GET /api/v1/legal-documents/{document_id}</text><text x="608" y="236" class="route">GET /api/v1/legal-documents/{document_id}/provisions</text><text x="608" y="256" class="route">GET /api/v1/legal-search</text><text x="608" y="280" class="note">Tra cứu từ corpus Markdown, có lọc Điều/Khoản/Điểm.</text>
<rect x="592" y="344" width="320" height="112" rx="6" class="group"/><text x="608" y="368" class="sub">HEALTH</text><text x="608" y="392" class="name">Kiểm tra dịch vụ</text><text x="608" y="416" class="route">GET /api/v1/health</text><text x="608" y="432" class="route">GET /api/v1/health/live</text><text x="608" y="448" class="route">GET /api/v1/health/ready</text>
<line x1="48" y1="612" x2="912" y2="612" stroke="rgba(45,49,66,.14)"/><text x="48" y="628" class="legend">XANH · HTTP/API</text><text x="240" y="628" class="legend">CAM · XÁC THỰC</text><text x="472" y="628" class="legend">HỘP · NHÓM ROUTE</text>
</svg><div class="footer">HÌNH 3.32 · Endpoint được lấy từ các router FastAPI đang đăng ký.</div></main></body></html>
