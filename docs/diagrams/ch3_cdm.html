<p>THIẾT KẾ DỮ LIỆU</p><h1>Mô hình dữ liệu quan niệm</h1><p>Các thực thể nghiệp vụ và quan hệ chính của ứng dụng hỏi đáp pháp luật.</p>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="ch3-cdm-title ch3-cdm-desc">

<desc id="ch3-cdm-desc">Mô hình khái niệm gồm người dùng, phiên chat, tin nhắn, phản hồi và dấu trang với sáu quan hệ riêng biệt và bội số rõ ràng.</desc>

<path class="rel" d="M560 112 H580"/><path class="rel" d="M660 112 H680"/>
<path class="rel" d="M280 264 H300"/><path class="rel" d="M380 264 H400"/>
<path class="rel" d="M560 264 H580"/><path class="rel" d="M660 264 H680"/>

<g class="relbox"><ellipse cx="620" cy="424" rx="40" ry="20"/><text class="relname" x="620" y="428" text-anchor="middle">được lưu</text></g>

<text class="card" x="568" y="104" text-anchor="middle">1</text><text class="card" x="672" y="104" text-anchor="middle">N</text>

<g><rect class="node" x="400" y="224" width="160" height="80" rx="8"/><text class="tag" x="416" y="248">THỰC THỂ</text><text class="label" x="480" y="276" text-anchor="middle">Tin nhắn</text><text class="sub" x="480" y="292" text-anchor="middle">nội dung · vai trò</text></g>
