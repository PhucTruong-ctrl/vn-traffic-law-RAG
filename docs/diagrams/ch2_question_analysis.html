<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phân tích câu hỏi và tách yêu cầu pháp lý</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.8 PHÂN TÍCH CÂU HỎI</p>
  <h1>Phân tích câu hỏi và tách yêu cầu pháp lý</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-question-analysis-title ch2-question-analysis-desc">
    <title id="ch2-question-analysis-title">Phân tích câu hỏi và tách yêu cầu pháp lý</title>
    <desc id="ch2-question-analysis-desc">Một câu hỏi về xe máy vượt đèn đỏ được phân tích bằng biểu thức chính quy, giữ ngữ cảnh phương tiện và hành vi, rồi tách thành yêu cầu về mức phạt và trừ điểm giấy phép.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Tree connectors before nodes. -->
    <line x1="480" y1="128" x2="480" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480 296 V328 H192 V384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480 328 H392 V384" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M480 328 H592 V384" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M480 328 H792 V384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Root question -->
    <g>
      <rect x="240" y="48" width="480" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="240" y="48" width="480" height="80" rx="8" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="256" y="72" class="tag">CÂU HỎI</text>
      <text x="480" y="96" class="name" text-anchor="middle">“Xe máy vượt đèn đỏ bị phạt bao nhiêu và trừ mấy điểm?”</text>
      <text x="480" y="116" class="sub" text-anchor="middle">Một câu hỏi chứa hai yêu cầu pháp lý</text>
    </g>

    <!-- Analyzer -->
    <g>
      <rect x="280" y="184" width="400" height="112" rx="8" fill="#f5f5f5"/>
      <rect x="280" y="184" width="400" height="112" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="296" y="208" class="tag">REGEX · QUY TẮC NHẬN DIỆN</text>
      <text x="480" y="236" class="name" text-anchor="middle">Nhận diện ngữ cảnh và yêu cầu</text>
      <text x="480" y="264" class="sub" text-anchor="middle">Phương tiện: xe máy · Hành vi: vượt đèn đỏ</text>
      <text x="480" y="284" class="sub" text-anchor="middle">Từ khóa: phạt · trừ điểm</text>
    </g>

    <!-- Context leaf -->
    <g>
      <rect x="112" y="384" width="160" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="112" y="384" width="160" height="96" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="128" y="408" class="tag">NGỮ CẢNH</text>
      <text x="192" y="436" class="name" text-anchor="middle">Xe máy</text>
      <text x="192" y="460" class="sub" text-anchor="middle">vượt đèn đỏ</text>
    </g>

    <!-- Intent 1 -->
    <g>
      <rect x="312" y="384" width="160" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="312" y="384" width="160" height="96" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="328" y="408" class="tag">INTENT 1</text>
      <text x="392" y="436" class="name" text-anchor="middle">Mức phạt</text>
      <text x="392" y="460" class="sub" text-anchor="middle">phạt bao nhiêu?</text>
    </g>

    <!-- Intent 2 -->
    <g>
      <rect x="512" y="384" width="160" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="512" y="384" width="160" height="96" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="528" y="408" class="tag">INTENT 2</text>
      <text x="592" y="436" class="name" text-anchor="middle">Trừ điểm GPLX</text>
      <text x="592" y="460" class="sub" text-anchor="middle">trừ mấy điểm?</text>
    </g>

    <!-- Bound -->
    <g>
      <rect x="712" y="384" width="160" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="712" y="384" width="160" height="96" rx="8" fill="rgba(45,49,66,.03)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="728" y="408" class="tag">GIỚI HẠN</text>
      <text x="792" y="436" class="name" text-anchor="middle">Tối đa 4 nhóm yêu cầu</text>
      <text x="792" y="460" class="sub" text-anchor="middle">loại bỏ kết quả trùng</text>
    </g>

    <!-- Optional expansion note -->
    <rect x="240" y="504" width="480" height="40" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399" stroke-dasharray="4,3"/>
    <text x="480" y="528" class="sub" text-anchor="middle">Thiếu loại phương tiện: tra cứu trong các nhóm đã định nghĩa trước.</text>

    <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="588" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="572" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="164" y="584" class="legend">YÊU CẦU PHÁP LÝ</text>
    <line x1="352" y1="580" x2="396" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="408" y="584" class="legend">TÁCH THEO QUY TẮC</text>
    <rect x="608" y="572" width="20" height="16" rx="4" fill="rgba(45,49,66,.025)" stroke="#7a8399" stroke-dasharray="4,3"/>
    <text x="640" y="584" class="legend">MỞ RỘNG KHI THIẾU PHƯƠNG TIỆN</text>
  </svg>
</main>
</body>
</html>
