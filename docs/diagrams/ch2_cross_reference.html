<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mở rộng căn cứ cùng Điều và tham chiếu liên quan</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .body { fill: #2d3142; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.10 MỞ RỘNG CĂN CỨ</p>
  <h1>Mở rộng căn cứ cùng Điều và tham chiếu liên quan</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-cross-reference-title ch2-cross-reference-desc">
    <title id="ch2-cross-reference-title">Mở rộng căn cứ cùng Điều và tham chiếu liên quan</title>
    <desc id="ch2-cross-reference-desc">Từ đoạn được truy xuất, hệ thống bổ sung tối đa hai đoạn xử phạt cùng nhóm pháp lý và các điều khoản được tham chiếu trong một bước, rồi gộp thành context có giới hạn.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors before nodes. -->
    <path d="M248 268 H296 Q304 268 304 260 V156 Q304 148 312 148 H360" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M248 268 H296 Q304 268 304 276 V380 Q304 388 312 388 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M600 148 H648 Q656 148 656 156 V232 Q656 240 664 240 H712" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M600 388 H648 Q656 388 656 380 V304 Q656 296 664 296 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Seed -->
    <g>
      <rect x="40" y="196" width="208" height="144" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="196" width="208" height="144" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="56" y="220" class="tag">ĐOẠN ĐƯỢC TRUY XUẤT</text>
      <text x="144" y="252" class="name" text-anchor="middle">Hành vi vi phạm</text>
      <text x="144" y="280" class="sub" text-anchor="middle">Có thể chưa đủ mức phạt,</text>
      <text x="144" y="300" class="sub" text-anchor="middle">trừ điểm hoặc biện pháp</text>
      <text x="144" y="320" class="sub" text-anchor="middle">bổ sung</text>
    </g>

    <!-- Sibling completion -->
    <g>
      <rect x="360" y="72" width="240" height="152" rx="8" fill="#f5f5f5"/>
      <rect x="360" y="72" width="240" height="152" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="376" y="96" class="tag">CÙNG NHÓM PHÁP LÝ</text>
      <text x="480" y="128" class="name" text-anchor="middle">Bổ sung đoạn xử phạt</text>
      <text x="480" y="156" class="sub" text-anchor="middle">phạt tiền · trừ điểm · tước quyền</text>
      <text x="480" y="176" class="sub" text-anchor="middle">tịch thu · tạm giữ</text>
      <text x="480" y="204" class="body" text-anchor="middle">Tối đa 2 đoạn bổ sung cho mỗi đoạn gốc</text>
    </g>

    <!-- Cross reference -->
    <g>
      <rect x="360" y="312" width="240" height="152" rx="8" fill="#f5f5f5"/>
      <rect x="360" y="312" width="240" height="152" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="376" y="336" class="tag">THAM CHIẾU PHÁP LÝ</text>
      <text x="480" y="368" class="name" text-anchor="middle">Tìm điều khoản được dẫn</text>
      <text x="480" y="396" class="sub" text-anchor="middle">Đọc tham chiếu trong đoạn gốc</text>
      <text x="480" y="416" class="sub" text-anchor="middle">rồi tra phần nội dung liên quan</text>
      <text x="480" y="444" class="body" text-anchor="middle">1 bước · tối đa 4 tham chiếu</text>
    </g>

    <!-- Bounded context -->
    <g>
      <rect x="712" y="188" width="208" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="712" y="188" width="208" height="160" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="728" y="212" class="tag">NGỮ CẢNH CHO MÔ HÌNH</text>
      <text x="816" y="244" class="name" text-anchor="middle">Có thêm căn cứ</text>
      <text x="816" y="272" class="sub" text-anchor="middle">Giữ đoạn gốc</text>
      <text x="816" y="292" class="sub" text-anchor="middle">Thêm đoạn cùng nhóm</text>
      <text x="816" y="312" class="sub" text-anchor="middle">Thêm điều khoản được viện dẫn</text>
      <text x="816" y="336" class="body" text-anchor="middle">Không nạp toàn bộ văn bản</text>
    </g>

    <rect x="40" y="492" width="880" height="44" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399" stroke-dasharray="4,3"/>
    <text x="480" y="520" class="sub" text-anchor="middle">Mỗi truy vấn có giới hạn tổng số tài liệu.</text>

    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="580" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="564" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="164" y="576" class="legend">BỔ SUNG CÙNG NHÓM</text>
    <rect x="396" y="564" width="20" height="16" rx="4" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
    <text x="428" y="576" class="legend">THAM CHIẾU MỘT BƯỚC</text>
    <text x="920" y="580" class="legend" text-anchor="end">HÌNH 2.11</text>
  </svg>
</main>
</body>
</html>
