<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mô hình RAG tổng quát</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(1280px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 32px/1.1 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .step { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .flow-label { fill: #eb6c36; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · KIẾN TRÚC TỔNG QUÁT</p>
  <h1>Mô hình RAG tổng quát</h1>
  <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-rag-overview-title ch2-rag-overview-desc">
    <title id="ch2-rag-overview-title">Mô hình RAG tổng quát</title>
    <desc id="ch2-rag-overview-desc">Người dùng đặt câu hỏi. Hệ thống truy xuất nội dung, chọn căn cứ, tạo câu trả lời rồi lưu câu hỏi, câu trả lời và nguồn.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="1200" height="520" fill="#f5f5f5"/>

    <!-- Connectors: drawn first so nodes mask endpoints. -->
    <line x1="248" y1="220" x2="284" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="456" y1="220" x2="492" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="664" y1="220" x2="700" y2="220" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="660" y="188" width="44" height="16" rx="4" fill="#f5f5f5"/>
    <text x="682" y="200" class="flow-label" text-anchor="middle">CĂN CỨ</text>
    <line x1="872" y1="220" x2="908" y2="220" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- 01: Question -->
    <g>
      <rect x="76" y="160" width="172" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="76" y="160" width="172" height="120" rx="8" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <rect x="88" y="172" width="28" height="16" rx="4" fill="rgba(45,49,66,.08)"/>
      <text x="102" y="184" class="step" text-anchor="middle">01</text>
      <text x="162" y="216" class="name" text-anchor="middle">Câu hỏi</text>
      <text x="162" y="244" class="sub" text-anchor="middle">Thông tin cần tìm</text>
    </g>

    <!-- 02: Retrieval -->
    <g>
      <rect x="284" y="160" width="172" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="284" y="160" width="172" height="120" rx="8" fill="#fff" stroke="#2d3142"/>
      <rect x="296" y="172" width="28" height="16" rx="4" fill="rgba(45,49,66,.08)"/>
      <text x="310" y="184" class="step" text-anchor="middle">02</text>
      <text x="370" y="216" class="name" text-anchor="middle">Truy xuất</text>
      <text x="370" y="244" class="sub" text-anchor="middle">Tìm nội dung liên quan</text>
    </g>

    <!-- 03: Evidence -->
    <g>
      <rect x="492" y="160" width="172" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="492" y="160" width="172" height="120" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <rect x="504" y="172" width="28" height="16" rx="4" fill="rgba(45,49,66,.08)"/>
      <text x="518" y="184" class="step" text-anchor="middle">03</text>
      <text x="578" y="216" class="name" text-anchor="middle">Căn cứ</text>
      <text x="578" y="244" class="sub" text-anchor="middle">Chọn nội dung làm căn cứ</text>
    </g>

    <!-- 04: Generation focal node -->
    <g>
      <rect x="700" y="160" width="172" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="700" y="160" width="172" height="120" rx="8" fill="rgba(235,108,54,.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="712" y="172" width="28" height="16" rx="4" fill="#eb6c36"/>
      <text x="726" y="184" fill="#fff" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="500" text-anchor="middle">04</text>
      <text x="786" y="208" class="name" text-anchor="middle">Sinh câu trả lời</text>
      <text x="786" y="236" class="sub" text-anchor="middle">Viết từ căn cứ đã chọn</text>
    </g>

    <!-- 05: Persistence -->
    <g>
      <rect x="908" y="160" width="172" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="908" y="160" width="172" height="120" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <rect x="920" y="172" width="28" height="16" rx="4" fill="rgba(45,49,66,.08)"/>
      <text x="934" y="184" class="step" text-anchor="middle">05</text>
      <text x="994" y="216" class="name" text-anchor="middle">Lưu kết quả</text>
      <text x="994" y="244" class="sub" text-anchor="middle">Câu hỏi · trả lời · nguồn</text>
    </g>

    <rect x="284" y="324" width="588" height="64" rx="8" fill="rgba(45,49,66,.05)" stroke="#7a8399"/>
    <text x="304" y="348" class="step">NGUYÊN TẮC</text>
    <text x="578" y="372" class="name" text-anchor="middle">Câu trả lời chỉ dùng căn cứ đã truy xuất.</text>

    <line x1="40" y1="440" x2="1160" y2="440" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="468" class="legend">CHÚ GIẢ</text>
    <line x1="132" y1="464" x2="176" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="188" y="468" class="legend">LUỒNG XỬ LÝ</text>
    <line x1="356" y1="464" x2="400" y2="464" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="412" y="468" class="legend">CHUYỂN CĂN CỨ</text>
    <line x1="596" y1="464" x2="640" y2="464" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="652" y="468" class="legend">ĐẦU RA ĐƯỢC LƯU</text>
  </svg>
</main>
</body>
</html>
