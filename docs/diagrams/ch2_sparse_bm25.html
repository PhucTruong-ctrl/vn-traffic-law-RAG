<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 và tìm kiếm theo từ khóa</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .label { fill: #2d3142; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .formula { fill: #2d3142; font: 500 16px 'Be Vietnam Pro', sans-serif; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.5 TÌM KIẾM SPARSE</p>
  <h1>BM25 ưu tiên từ khóa đặc trưng</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-sparse-bm25-title ch2-sparse-bm25-desc">
    <title id="ch2-sparse-bm25-title">BM25 và tìm kiếm theo từ khóa</title>
    <desc id="ch2-sparse-bm25-desc">BM25 xếp đoạn chứa đầy đủ cụm từ pháp lý lên trước đoạn chỉ có một phần từ khóa, từ phổ biến hoặc không có từ khóa truy vấn.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Query and formula -->
    <rect x="40" y="32" width="424" height="88" rx="8" fill="#fff" stroke="#2d3142"/>
    <text x="56" y="56" class="tag">TRUY VẤN</text>
    <text x="56" y="88" class="name">“xe ô tô phạt tiền Điều 5”</text>
    <text x="56" y="108" class="sub">Từ hiếm và cụm pháp lý có trọng số cao.</text>

    <rect x="496" y="32" width="424" height="88" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399"/>
    <text x="512" y="56" class="tag">BM25</text>
    <text x="512" y="84" class="formula">Σ IDF(t) × TF đã chuẩn hóa theo độ dài</text>
    <text x="512" y="108" class="sub">k₁ điều chỉnh tần suất. b điều chỉnh độ dài tài liệu.</text>

    <!-- Plot grid -->
    <line x1="248" y1="176" x2="896" y2="176" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="248" y1="240" x2="896" y2="240" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="248" y1="304" x2="896" y2="304" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="248" y1="368" x2="896" y2="368" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="248" y1="432" x2="896" y2="432" stroke="rgba(45,49,66,.25)" stroke-width="1"/>
    <line x1="248" y1="160" x2="248" y2="432" stroke="rgba(45,49,66,.25)" stroke-width="1"/>
    <text x="248" y="148" class="tag">THỨ TỰ ƯU TIÊN BM25 · MINH HỌA</text>

    <!-- Category labels -->
    <text x="224" y="200" class="label" text-anchor="end">Đủ cụm đặc trưng</text>
    <text x="224" y="264" class="label" text-anchor="end">Khớp một phần</text>
    <text x="224" y="328" class="label" text-anchor="end">Từ phổ biến</text>
    <text x="224" y="392" class="label" text-anchor="end">Không khớp</text>

    <!-- Horizontal bars; lengths are ordinal, not measured scores. -->
    <rect x="248" y="180" width="584" height="40" rx="4" fill="rgba(235,108,54,.12)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="264" y="204" class="label">“xe ô tô” + “phạt tiền” + “Điều 5”</text>

    <rect x="248" y="244" width="408" height="40" rx="4" fill="rgba(79,93,117,.15)" stroke="#4f5d75"/>
    <text x="264" y="268" class="label">“xe ô tô” + “phạt tiền”</text>

    <rect x="248" y="308" width="232" height="40" rx="4" fill="rgba(79,93,117,.15)" stroke="#4f5d75"/>
    <text x="264" y="332" class="label">“xe” + “phạt”</text>

    <rect x="248" y="372" width="96" height="40" rx="4" fill="rgba(79,93,117,.08)" stroke="#7a8399" stroke-width="0.8"/>
    <text x="360" y="396" class="sub">không có từ khóa truy vấn</text>

    <!-- Explanation -->
    <rect x="40" y="456" width="856" height="72" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399"/>
    <text x="56" y="480" class="tag">TRONG DỰ ÁN</text>
    <text x="56" y="508" class="sub">FastEmbedSparse("Qdrant/bm25") tạo sparse vector để Qdrant xếp hạng chunk theo từ khóa.</text>

    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="580" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="564" width="20" height="16" rx="4" fill="rgba(235,108,54,.12)" stroke="#eb6c36"/>
    <text x="164" y="576" class="legend">KHỚP ĐẶC TRƯNG</text>
    <rect x="352" y="564" width="20" height="16" rx="4" fill="rgba(79,93,117,.15)" stroke="#4f5d75"/>
    <text x="384" y="576" class="legend">KHỚP YẾU HƠN</text>
    <text x="584" y="576" class="legend">CHIỀU DÀI THANH CHỈ THỂ HIỆN THỨ TỰ</text>
  </svg>
</main>
</body>
</html>
