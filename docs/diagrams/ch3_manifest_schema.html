<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lược đồ manifest nguồn luật</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#2d3142;font-family:'Be Vietnam Pro',sans-serif}.page{width:min(960px,100%);margin:auto;padding:32px 40px 24px}h1{margin:0 0 8px;font-size:28px;font-weight:500}p{margin:0 0 16px;color:#4f5d75;font-size:12px}svg{display:block;width:100%;height:auto}.node{fill:#fff;stroke:#2d3142;stroke-width:1}.focal{fill:#fff0e9;stroke:#eb6c36}.head{font:600 12px 'Be Vietnam Pro';fill:#2d3142}.field{font:400 10px 'Be Vietnam Pro';fill:#4f5d75}.tag{font:500 8px 'Be Vietnam Pro';fill:#4f5d75;letter-spacing:.08em}.rel{stroke:#4f5d75;stroke-width:1.2;fill:none}.card{font:500 8px 'Be Vietnam Pro';fill:#4f5d75}.foot{font:500 10px 'Be Vietnam Pro';fill:#4f5d75}</style></head>
<body><main class="page"><p>DỮ LIỆU NGUỒN</p><h1>Lược đồ manifest nguồn luật</h1><p>Cấu trúc thực tế của <span style="font-family:monospace">data/sources/manifest.json</span>.</p><svg viewBox="0 0 960 600" role="img" aria-labelledby="ch3-manifest-title ch3-manifest-desc"><title id="ch3-manifest-title">Lược đồ manifest nguồn luật</title><desc id="ch3-manifest-desc">Lược đồ cho thấy manifest là một đối tượng chứa danh sách documents, mỗi phần tử có các khóa nhận diện và hiệu lực.</desc><defs><marker id="manifest-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
<path class="rel" d="M480 164 V244" marker-end="url(#manifest-arrow)"/><path class="rel" d="M480 388 V420" marker-end="url(#manifest-arrow)"/><text class="card" x="496" y="208">chứa 1 danh sách</text><text class="card" x="496" y="408">mỗi phần tử</text>
<g><rect class="node focal" x="340" y="68" width="280" height="96" rx="8"/><text class="tag" x="356" y="88">OBJECT</text><text class="head" x="356" y="116">manifest</text><text class="field" x="356" y="140">documents: [ ... ]</text></g>
<g><rect class="node" x="340" y="244" width="280" height="144" rx="8"/><text class="tag" x="356" y="264">LIST</text><text class="head" x="356" y="292">documents[]</text><text class="field" x="356" y="316">document_id</text><text class="field" x="356" y="332">document_number</text><text class="field" x="356" y="348">document_name · file</text><text class="field" x="356" y="364">status · effective_from</text><text class="field" x="356" y="380">effective_to (khi có)</text></g>
<g><rect class="node" x="340" y="420" width="280" height="96" rx="8"/><text class="tag" x="356" y="440">OBJECT ITEM</text><text class="head" x="356" y="468">một văn bản</text><text class="field" x="356" y="492">giá trị minh họa, khóa giữ nguyên</text></g>
<line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,.12)"/><text class="foot" x="40" y="572">HÌNH 3.30 · LƯỢC ĐỒ MANIFEST NGUỒN LUẬT</text></svg></main></body></html>
