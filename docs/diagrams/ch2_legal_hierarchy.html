<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấu trúc văn bản pháp luật</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · CẤU TRÚC PHÁP LÝ</p>
  <h1>Cấu trúc văn bản pháp luật</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-legal-hierarchy-title ch2-legal-hierarchy-desc">
    <title id="ch2-legal-hierarchy-title">Cấu trúc văn bản pháp luật</title>
    <desc id="ch2-legal-hierarchy-desc">Văn bản pháp luật gồm nhiều Điều. Một Điều có thể có nhiều Khoản, và mỗi Khoản có thể chia thành các Điểm.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors: orthogonal buses, drawn before nodes. -->
    <path d="M480 112 V144 H320 V176" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M480 144 H640 V176" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M320 240 V272 H232 V304" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M320 272 H408 V304" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M232 368 V400 H196 V432" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M232 400 H336 V432" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M232 400 H476 V432" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

    <!-- Root -->
    <g>
      <rect x="340" y="48" width="280" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="340" y="48" width="280" height="64" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="76" class="name" text-anchor="middle">Văn bản pháp luật</text>
      <text x="480" y="96" class="sub" text-anchor="middle">Luật · Nghị định · Thông tư</text>
    </g>

    <!-- Articles -->
    <g>
      <rect x="240" y="176" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="240" y="176" width="160" height="64" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="320" y="204" class="name" text-anchor="middle">Điều 7</text>
      <text x="320" y="224" class="sub" text-anchor="middle">Một quy định</text>
    </g>
    <g>
      <rect x="560" y="176" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="560" y="176" width="160" height="64" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="640" y="204" class="name" text-anchor="middle">Điều 8</text>
      <text x="640" y="224" class="sub" text-anchor="middle">Quy định tiếp theo</text>
    </g>

    <!-- Clauses -->
    <g>
      <rect x="152" y="304" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="152" y="304" width="160" height="64" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="232" y="332" class="name" text-anchor="middle">Khoản 1</text>
      <text x="232" y="352" class="sub" text-anchor="middle">Nội dung thuộc Điều 7</text>
    </g>
    <g>
      <rect x="328" y="304" width="160" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="328" y="304" width="160" height="64" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="408" y="332" class="name" text-anchor="middle">Khoản 2</text>
      <text x="408" y="352" class="sub" text-anchor="middle">Khoản kế tiếp</text>
    </g>

    <!-- Points -->
    <g>
      <rect x="136" y="432" width="120" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="136" y="432" width="120" height="64" rx="8" fill="rgba(45,49,66,.03)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="196" y="460" class="name" text-anchor="middle">Điểm a)</text>
      <text x="196" y="480" class="sub" text-anchor="middle">Nội dung chi tiết</text>
    </g>
    <g>
      <rect x="276" y="432" width="120" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="276" y="432" width="120" height="64" rx="8" fill="rgba(45,49,66,.03)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="336" y="460" class="name" text-anchor="middle">Điểm d)</text>
      <text x="336" y="480" class="sub" text-anchor="middle">Nhãn d)</text>
    </g>
    <g>
      <rect x="416" y="432" width="120" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="416" y="432" width="120" height="64" rx="8" fill="rgba(45,49,66,.03)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="476" y="460" class="name" text-anchor="middle">Điểm đ)</text>
      <text x="476" y="480" class="sub" text-anchor="middle">Nhãn đ), khác d)</text>
    </g>
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="568" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="552" width="20" height="16" rx="4" fill="#fff" stroke="#2d3142"/>
    <text x="164" y="564" class="legend">ĐƠN VỊ PHÁP LÝ</text>
    <line x1="304" y1="560" x2="348" y2="560" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="360" y="564" class="legend">QUAN HỆ CHA–CON</text>
    <rect x="524" y="552" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="556" y="564" class="legend">VĂN BẢN GỐC</text>
  </svg>
</main>
</body>
</html>
