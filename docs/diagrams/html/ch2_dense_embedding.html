<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm kiếm ngữ nghĩa bằng dense embedding</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .label { fill: #2d3142; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .formula { fill: #2d3142; font: 500 16px 'Be Vietnam Pro', sans-serif; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.6 TÌM KIẾM DENSE</p>
  <h1>Tìm kiếm ngữ nghĩa bằng dense embedding</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-dense-embedding-title ch2-dense-embedding-desc">
    <title id="ch2-dense-embedding-title">Tìm kiếm ngữ nghĩa bằng dense embedding</title>
    <desc id="ch2-dense-embedding-desc">Biểu đồ phân tán minh họa câu hỏi và các đoạn văn được ánh xạ thành vector. Những đoạn gần câu hỏi về ngữ nghĩa được xếp trước dù dùng từ khác.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Configuration and formula -->
    <rect x="40" y="32" width="424" height="88" rx="8" fill="#fff" stroke="#2d3142"/>
    <text x="56" y="56" class="tag">VECTOR NGỮ NGHĨA</text>
    <text x="56" y="84" class="name">OpenRouter · 768 chiều · vector “dense”</text>
    <text x="56" y="108" class="sub">Câu hỏi và đoạn văn dùng chung một không gian vector.</text>

    <rect x="496" y="32" width="424" height="88" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399"/>
    <text x="512" y="56" class="tag">ĐỘ TƯƠNG ĐỒNG COSINE</text>
    <text x="512" y="84" class="formula">cos(x, y) = (x · y) / (‖x‖ ‖y‖)</text>
    <text x="512" y="108" class="sub">Giá trị cao hơn thường cho biết hai vector gần hướng hơn.</text>

    <!-- Plot frame -->
    <line x1="120" y1="440" x2="872" y2="440" stroke="rgba(45,49,66,.25)" stroke-width="1"/>
    <line x1="120" y1="152" x2="120" y2="440" stroke="rgba(45,49,66,.25)" stroke-width="1"/>
    <line x1="120" y1="368" x2="872" y2="368" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="120" y1="296" x2="872" y2="296" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="120" y1="224" x2="872" y2="224" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="308" y1="152" x2="308" y2="440" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="496" y1="152" x2="496" y2="440" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <line x1="684" y1="152" x2="684" y2="440" stroke="rgba(45,49,66,.08)" stroke-width="0.8"/>
    <text x="120" y="140" class="tag">KHÔNG GIAN EMBEDDING · MINH HỌA 2D</text>

    <!-- Neighborhood, not a measured radius. -->
    <circle cx="360" cy="276" r="104" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.45)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="252" y="176" class="tag">CỤM NGỮ NGHĨA GẦN</text>

    <!-- Query and semantically close chunks -->
    <circle cx="360" cy="276" r="12" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="268" class="label">“bị giữ bằng lái bao lâu?”</text>
    <text x="380" y="288" class="sub">Câu hỏi</text>

    <circle cx="296" cy="236" r="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="180" y="212" class="label">Tước GPLX trong 2 tháng</text>
    <text x="180" y="228" class="sub">Thuật ngữ pháp lý</text>

    <circle cx="420" cy="328" r="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="444" y="316" class="label">Thời hạn tước quyền</text>
    <text x="444" y="336" class="sub">Cùng ý, khác cách nói</text>

    <circle cx="336" cy="356" r="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="228" y="408" class="label">Không được sử dụng GPLX</text>

    <!-- Far, unrelated chunks -->
    <circle cx="716" cy="212" r="8" fill="rgba(79,93,117,.35)" stroke="#4f5d75"/>
    <text x="736" y="208" class="label">Đăng ký xe</text>
    <text x="736" y="228" class="sub">Khác chủ đề</text>

    <circle cx="760" cy="348" r="8" fill="rgba(79,93,117,.35)" stroke="#4f5d75"/>
    <text x="780" y="344" class="label">Biển báo đường bộ</text>
    <text x="780" y="364" class="sub">Khác chủ đề</text>

    <circle cx="612" cy="396" r="8" fill="rgba(79,93,117,.35)" stroke="#4f5d75"/>
    <text x="632" y="400" class="label">Đăng kiểm phương tiện</text>

    <!-- Interpretation -->
    <rect x="120" y="464" width="752" height="64" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399"/>
    <text x="136" y="488" class="tag">CÁCH ĐỌC</text>
    <text x="136" y="512" class="sub">Điểm gần câu hỏi có nội dung gần nghĩa. Vị trí và khoảng cách trong hình chỉ dùng để minh họa.</text>

    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="580" class="legend">CHÚ GIẢ</text>
    <circle cx="144" cy="572" r="6" fill="#eb6c36" stroke="#2d3142"/>
    <text x="160" y="576" class="legend">CÂU HỎI</text>
    <circle cx="292" cy="572" r="6" fill="#fff" stroke="#4f5d75"/>
    <text x="308" y="576" class="legend">CHUNK GẦN NGHĨA</text>
    <circle cx="496" cy="572" r="6" fill="rgba(79,93,117,.35)" stroke="#4f5d75"/>
    <text x="512" y="576" class="legend">CHUNK KHÁC CHỦ ĐỀ</text>
  </svg>
</main>
</body>
</html>
