<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1000">
<title>Tuần tự sinh và làm sạch</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1000px;height:620px;overflow:hidden;background:#f5f5f5;color:#2d3142;font-family:'Be Vietnam Pro',sans-serif}svg{display:block;width:1000px;height:620px}.actor{fill:#fff;stroke:#2d3142;stroke-width:2}.focus{fill:#fff1e9;stroke:#eb6c36;stroke-width:2}.life{stroke:#4f5d75;stroke-width:2;stroke-dasharray:8 8}.call{fill:none;stroke:#2e5aa8;stroke-width:2;marker-end:url(#ch3-call)}.return{fill:none;stroke:#4f5d75;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#ch3-return)}.bar{fill:#2d3142}.frame{fill:none;stroke:#eb6c36;stroke-width:2;stroke-dasharray:8 8}.mask{fill:#f5f5f5}.name{fill:#2d3142;font-size:12px;font-weight:600;text-anchor:middle}.label{fill:#4f5d75;font-size:12px;font-weight:500}.note{fill:#4f5d75;font-size:12px}
</style>
</head>
<body>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch3-title ch3-desc">
<title id="ch3-title">Tuần tự sinh và làm sạch</title>
<desc id="ch3-desc">Sơ đồ tuần tự giữa máy chủ, bộ sinh câu trả lời, nhà cung cấp mô hình và bộ làm sạch trích dẫn, gồm thử lại, từ chối và làm sạch kết quả.</desc>
<defs>
<marker id="ch3-call" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
<marker id="ch3-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="1000" height="620" fill="#f5f5f5"/>
<!-- actor headers -->
<rect class="actor" x="40" y="24" width="176" height="56" rx="8"/>
<rect class="focus" x="280" y="24" width="176" height="56" rx="8"/>
<rect class="actor" x="520" y="24" width="176" height="56" rx="8"/>
<rect class="actor" x="760" y="24" width="176" height="56" rx="8"/>
<text class="name" x="128" y="58">Máy chủ</text>
<text class="name" x="368" y="58">Bộ sinh câu trả lời</text>
<text class="name" x="608" y="58">Nhà cung cấp mô hình</text>
<text class="name" x="848" y="58">Bộ làm sạch trích dẫn</text>
<!-- lifelines -->
<line class="life" x1="128" y1="80" x2="128" y2="580"/>
<line class="life" x1="368" y1="80" x2="368" y2="580"/>
<line class="life" x1="608" y1="80" x2="608" y2="580"/>
<line class="life" x1="848" y1="80" x2="848" y2="580"/>
<!-- activations -->
<rect class="bar" x="116" y="112" width="24" height="64" rx="4"/>
<rect class="bar" x="356" y="176" width="24" height="184" rx="4"/>
<rect class="bar" x="596" y="240" width="24" height="64" rx="4"/>
<rect class="bar" x="836" y="424" width="24" height="80" rx="4"/>
<!-- messages -->
<path class="call" d="M140 112H356"/>
<path class="call" d="M380 176H596"/>
<path class="return" d="M596 304H380"/>
<path class="return" d="M356 360H140"/>
<path class="call" d="M380 424H836"/>
<path class="return" d="M836 504H140"/>
<!-- retry fragment -->
<rect class="frame" x="488" y="208" width="264" height="136" rx="8"/>
<rect class="mask" x="504" y="200" width="96" height="18" rx="4"/>
<text class="label" x="552" y="213" text-anchor="middle">THỬ LẠI</text>
<!-- message labels -->
<rect class="mask" x="188" y="94" width="120" height="18" rx="4"/>
<text class="label" x="248" y="107" text-anchor="middle">lệnh + ngữ cảnh</text>
<rect class="mask" x="434" y="158" width="124" height="18" rx="4"/>
<text class="label" x="496" y="171" text-anchor="middle">gọi nhà cung cấp</text>
<rect class="mask" x="430" y="286" width="144" height="18" rx="4"/>
<text class="label" x="502" y="299" text-anchor="middle">429 / lỗi máy chủ</text>
<rect class="mask" x="186" y="342" width="128" height="18" rx="4"/>
<text class="label" x="250" y="355" text-anchor="middle">từ chối chuẩn</text>
<rect class="mask" x="598" y="406" width="148" height="18" rx="4"/>
<text class="label" x="672" y="419" text-anchor="middle">nội dung sinh ra</text>
<rect class="mask" x="390" y="486" width="168" height="18" rx="4"/>
<text class="label" x="474" y="499" text-anchor="middle">kết quả đã làm sạch</text>
<text class="note" x="620" y="232">nếu lỗi 429 hoặc lỗi máy chủ</text>
<text class="note" x="620" y="328">thử lại; nếu hết lượt → từ chối</text>
</svg>
</body>
</html>
