<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm kiếm kết hợp trong Qdrant</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .arrow-label { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.7 TÌM KIẾM KẾT HỢP</p>
  <h1>Kết hợp dense và sparse trong Qdrant</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-hybrid-retrieval-title ch2-hybrid-retrieval-desc">
    <title id="ch2-hybrid-retrieval-title">Tìm kiếm kết hợp trong Qdrant</title>
    <desc id="ch2-hybrid-retrieval-desc">Qdrant lưu dense vector và sparse vector trong cùng một point. Mỗi truy vấn dùng cả tìm kiếm ngữ nghĩa và tìm kiếm từ khóa để lấy các chunk phù hợp.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Zones -->
    <rect x="280" y="64" width="400" height="336" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
    <rect x="296" y="56" width="72" height="16" rx="4" fill="#f5f5f5"/>
    <text x="332" y="68" class="tag" text-anchor="middle">QDRANT</text>

    <!-- Query connectors -->
    <path d="M224 240 H264 Q272 240 272 232 V168 Q272 160 280 160 H320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M224 264 H264 Q272 264 272 272 V328 Q272 336 280 336 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480 208 V232 Q480 240 488 240 H536 Q544 240 544 248 V272" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M480 288 V280 Q480 272 488 272 H520 Q528 272 528 280 V312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="584" y1="248" x2="736" y2="248" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Rebuild connector -->
    <path d="M208 456 H448 Q456 456 456 448 V392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="288" y="424" width="96" height="16" rx="4" fill="#f5f5f5"/>
    <text x="336" y="436" class="arrow-label" text-anchor="middle">TẠO LẠI CHỈ MỤC</text>

    <!-- Query -->
    <g>
      <rect x="40" y="192" width="184" height="120" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="192" width="184" height="120" rx="20" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="56" y="216" class="tag">TRUY VẤN</text>
      <text x="132" y="248" class="name" text-anchor="middle">Câu hỏi người dùng</text>
      <text x="132" y="276" class="sub" text-anchor="middle">ý nghĩa + từ khóa</text>
      <text x="132" y="296" class="sub" text-anchor="middle">hoặc định danh pháp lý</text>
    </g>

    <!-- Dense search -->
    <g>
      <rect x="320" y="112" width="320" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="112" width="320" height="96" rx="8" fill="#fff" stroke="#2e5aa8"/>
      <text x="336" y="136" class="tag">DENSE · SEMANTIC</text>
      <text x="480" y="164" class="name" text-anchor="middle">Tìm đoạn gần nghĩa</text>
      <text x="480" y="188" class="sub" text-anchor="middle">vector tên dense</text>
    </g>

    <!-- Sparse search -->
    <g>
      <rect x="320" y="304" width="320" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="304" width="320" height="80" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="336" y="328" class="tag">SPARSE · BM25</text>
      <text x="480" y="352" class="name" text-anchor="middle">Tìm từ khóa chính xác</text>
      <text x="480" y="376" class="sub" text-anchor="middle">vector tên sparse</text>
    </g>

    <!-- Shared point / hybrid store -->
    <g>
      <rect x="376" y="224" width="208" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="376" y="224" width="208" height="64" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="248" class="name" text-anchor="middle">Cùng một điểm Qdrant</text>
      <text x="480" y="272" class="sub" text-anchor="middle">dense + sparse + metadata</text>
    </g>

    <!-- Results -->
    <g>
      <rect x="736" y="184" width="184" height="128" rx="20" fill="#f5f5f5"/>
      <rect x="736" y="184" width="184" height="128" rx="20" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="752" y="208" class="tag">HYBRID</text>
      <text x="828" y="240" class="name" text-anchor="middle">Đoạn phù hợp</text>
      <text x="828" y="268" class="sub" text-anchor="middle">khớp nghĩa hoặc từ khóa</text>
      <text x="828" y="292" class="sub" text-anchor="middle">RetrievalMode.HYBRID</text>
    </g>

    <!-- Rebuild source -->
    <g>
      <rect x="40" y="416" width="168" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="416" width="168" height="80" rx="8" fill="rgba(45,49,66,.03)" stroke="#4f5d75" stroke-dasharray="4,3"/>
      <text x="56" y="440" class="tag">DỮ LIỆU XỬ LÝ</text>
      <text x="124" y="468" class="name" text-anchor="middle">chunks.jsonl</text>
      <text x="124" y="488" class="sub" text-anchor="middle">dùng để dựng lại chỉ mục</text>
    </g>

    <rect x="736" y="400" width="184" height="96" rx="8" fill="#f5f5f5" stroke="#7a8399"/>
    <text x="752" y="424" class="tag">LƯU RIÊNG</text>
    <text x="828" y="452" class="name" text-anchor="middle">Nguồn pháp luật gốc</text>
    <text x="828" y="476" class="sub" text-anchor="middle">không nằm trong chỉ mục</text>

    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="580" class="legend">CHÚ GIẢ</text>
    <line x1="132" y1="572" x2="176" y2="572" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="188" y="576" class="legend">DENSE</text>
    <line x1="284" y1="572" x2="328" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="340" y="576" class="legend">SPARSE</text>
    <rect x="444" y="564" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="476" y="576" class="legend">KẾT HỢP TRONG QDRANT</text>
    <line x1="684" y1="572" x2="728" y2="572" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="740" y="576" class="legend">DỰNG LẠI CHỈ MỤC</text>
  </svg>
</main>
</body>
</html>
