<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1000">
<title>Phân tích câu hỏi</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1000px;height:800px;overflow:hidden;background:#f5f5f5;color:#2d3142;font-family:'Be Vietnam Pro',sans-serif}svg{display:block;width:1000px;height:800px}.ink{fill:#2d3142}.muted{fill:#4f5d75}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#ch2-arrow)}.accent-line{fill:none;stroke:#eb6c36;stroke-width:2;marker-end:url(#ch2-accent)}.box{fill:#fff;stroke:#2d3142;stroke-width:2}.focus{fill:#fff1e9;stroke:#eb6c36;stroke-width:2}.decision{fill:#fff;stroke:#4f5d75;stroke-width:2}.name{font-size:16px;font-weight:600}.body{font-size:12px}.small{font-size:12px}.label{font-size:12px;font-weight:500}.mask{fill:#f5f5f5}
</style>
</head>
<body>
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-title ch2-desc">
<title id="ch2-title">Phân tích câu hỏi</title>
<desc id="ch2-desc">Lưu đồ nhận câu hỏi và lịch sử, gọi mô hình trả JSON năm trường, kiểm tra lỗi hoặc thời gian chờ và tạo đầu ra cho tìm kiếm.</desc>
<defs>
<marker id="ch2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="ch2-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="1000" height="800" fill="#f5f5f5"/>
<!-- connectors -->
<path class="line" d="M500 132V168"/>
<path class="line" d="M500 300V336H292V376"/>
<path class="accent-line" d="M500 300V336H708V376"/>
<path class="line" d="M292 536V576H500V616"/>
<path class="line" d="M708 536V576H500V616"/>
<!-- nodes -->
<rect class="box" x="240" y="52" width="520" height="80" rx="8"/>
<text class="ink name" x="500" y="84" text-anchor="middle">Nhận đầu vào</text>
<text class="muted body" x="500" y="112" text-anchor="middle">câu hỏi người dùng + lịch sử hội thoại</text>
<rect class="focus" x="240" y="168" width="520" height="132" rx="8"/>
<text class="ink name" x="500" y="200" text-anchor="middle">Gọi mô hình</text>
<text class="muted body" x="500" y="228" text-anchor="middle">JSON: loại yêu cầu · ý định · loại phương tiện</text>
<text class="muted body" x="500" y="252" text-anchor="middle">câu hỏi độc lập · tối đa 3 truy vấn mở rộng</text>
<text class="muted small" x="500" y="280" text-anchor="middle">giới hạn chờ 15 giây</text>
<polygon class="decision" points="292,376 412,456 292,536 172,456"/>
<text class="ink name" x="292" y="448" text-anchor="middle">JSON hợp lệ?</text>
<text class="muted small" x="292" y="472" text-anchor="middle">đủ 5 trường</text>
<polygon class="decision" points="708,376 828,456 708,536 588,456"/>
<text class="ink name" x="708" y="440" text-anchor="middle">Lỗi hoặc quá</text>
<text class="ink name" x="708" y="460" text-anchor="middle">15 giây?</text>
<text class="muted small" x="708" y="484" text-anchor="middle">dùng dự phòng tất định</text>
<rect class="box" x="300" y="616" width="400" height="92" rx="8"/>
<text class="ink name" x="500" y="650" text-anchor="middle">Đầu ra cho tìm kiếm</text>
<text class="muted body" x="500" y="678" text-anchor="middle">câu hỏi độc lập + tối đa 3 truy vấn mở rộng</text>
<!-- branch labels with masks and visible gap -->
<rect class="mask" x="254" y="326" width="76" height="18" rx="4"/>
<text class="muted label" x="292" y="339" text-anchor="middle">ĐÚNG</text>
<rect class="mask" x="670" y="326" width="76" height="18" rx="4"/>
<text class="muted label" x="708" y="339" text-anchor="middle">LỖI</text>
</svg>
</body>
</html>
