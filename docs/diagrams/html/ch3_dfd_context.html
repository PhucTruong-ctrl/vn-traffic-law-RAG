<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ luồng dữ liệu mức ngữ cảnh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--accent-tint:#fbe5da;--rule:rgba(45,49,66,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro','Segoe UI',sans-serif}main{max-width:1280px;margin:0 auto;padding:40px 44px 32px}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.025em}.subtitle{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.6}figure{margin:32px 0 0;overflow-x:auto}svg{display:block;width:100%;min-width:1120px;height:auto}.label{font-family:'Be Vietnam Pro','Segoe UI',sans-serif;fill:var(--muted);font-size:12px;font-weight:500}.node-label{font-family:'Be Vietnam Pro','Segoe UI',sans-serif;fill:var(--ink);font-size:16px;font-weight:600}.process-label{font-size:18px;font-weight:700}.tag{font-family:'Be Vietnam Pro','Segoe UI',sans-serif;fill:var(--accent);font-size:10px;font-weight:700;letter-spacing:.12em}.connector{fill:none;stroke:var(--muted);stroke-width:1.2}.legend{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:28px;align-items:center;color:var(--muted);font-size:12px}.legend strong{font-size:11px;letter-spacing:.14em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}.dot.actor{background:rgba(79,93,117,.18);border:1px solid var(--soft)}.dot.process{background:var(--accent-tint);border:1px solid var(--accent)}footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--rule);color:var(--soft);font-size:11px}
</style>
</head>
<body>
<main>
<p class="eyebrow">CH3 · DATA FLOW DIAGRAM</p>
<h1 class="title">Sơ đồ luồng dữ liệu mức ngữ cảnh</h1>
<p class="subtitle">Một tiến trình trung tâm và luồng trao đổi dữ liệu với người dùng.</p>
<figure>
<svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch3-dfd-context-title ch3-dfd-context-desc">
<title id="ch3-dfd-context-title">Sơ đồ luồng dữ liệu mức ngữ cảnh</title>
<desc id="ch3-dfd-context-desc">Sơ đồ ngữ cảnh cho thấy người dùng trao đổi câu hỏi, xác thực, yêu cầu tra cứu và nội dung lưu với hệ thống hỗ trợ tra cứu pháp luật giao thông Việt Nam.</desc>
<defs>
<marker id="ch3-dfd-context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="ch3-dfd-context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="ch3-dfd-context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- connectors first; each direction uses distinct attachment and route -->
<path class="connector" d="M260 260H320V236H400" marker-end="url(#ch3-dfd-context-arrow)"/>
<path class="connector" d="M400 284H320V308H260" marker-end="url(#ch3-dfd-context-arrow-accent)"/>
<rect x="270" y="217" width="122" height="16" rx="2" fill="#f5f5f5"/><text class="label" x="331" y="229" text-anchor="middle">DỮ LIỆU VÀO</text>
<rect x="270" y="315" width="122" height="16" rx="2" fill="#f5f5f5"/><text class="label" x="331" y="327" text-anchor="middle">DỮ LIỆU RA</text>
<!-- actor -->
<rect x="80" y="224" width="180" height="96" rx="6" fill="rgba(79,93,117,.10)"/>
<rect x="80" y="224" width="180" height="96" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399" stroke-width="1"/>
<rect x="96" y="236" width="52" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,.55)" stroke-width=".8"/><text class="tag" x="122" y="248" text-anchor="middle" fill="#4f5d75">ACTOR</text>
<text class="node-label" x="170" y="278" text-anchor="middle">Người dùng</text>
<text class="label" x="170" y="298" text-anchor="middle">người khởi tạo và nhận</text>
<!-- central process -->
<rect x="400" y="188" width="640" height="128" rx="8" fill="#fbe5da"/>
<rect x="400" y="188" width="640" height="128" rx="8" fill="#fbe5da" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="420" y="204" width="76" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,.65)" stroke-width=".8"/><text class="tag" x="458" y="216" text-anchor="middle">PROCESS</text>
<text class="node-label process-label" x="720" y="254" text-anchor="middle">Hệ thống hỗ trợ tra cứu pháp luật</text>
<text class="node-label process-label" x="720" y="282" text-anchor="middle">giao thông Việt Nam</text>
<text class="label" x="720" y="304" text-anchor="middle">tra cứu · trả lời · xác thực · lưu nội dung</text>
<!-- flow callouts -->
<text class="label" x="560" y="174" text-anchor="middle">Câu hỏi · Thông tin đăng nhập · Yêu cầu tra cứu</text>
<text class="label" x="720" y="360" text-anchor="middle">Câu trả lời · Trích dẫn · Văn bản pháp luật · Lịch sử hội thoại · Kết quả xác thực</text>
</svg>
</figure>
<div class="legend"><strong>CHÚ GIẢI</strong><span><i class="dot actor"></i>Thực thể bên ngoài</span><span><i class="dot process"></i>Tiến trình trung tâm</span></div>
<footer>DFD mức ngữ cảnh · Chỉ biểu diễn một tiến trình trung tâm và trao đổi dữ liệu với người dùng</footer>
</main>
</body>
</html>
