<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1000">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1000px; height: 520px; margin: 0; overflow: hidden; }
    body { background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 1000px; height: 520px; }
    .head { fill: #4f5d75; font-size: 12px; font-weight: 600; }
    .cell { fill: #2d3142; font-size: 12px; font-weight: 400; }
    .result { fill: #2e5aa8; font-size: 12px; font-weight: 600; }
    .note { fill: #4f5d75; font-size: 10px; font-weight: 400; }
    .table { fill: #fff; stroke: rgba(45,49,66,.25); stroke-width: 1; }
    .rule { stroke: rgba(45,49,66,.2); stroke-width: 1; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Trạng thái kiểm thử</title>
    <desc id="diagram-desc">Bảng gồm bốn hạng mục kiểm tra và kết quả tương ứng.</desc>
    <rect class="table" x="24" y="24" width="952" height="320" rx="8"/>
    <line class="rule" x1="24" y1="76" x2="976" y2="76"/>
    <line class="rule" x1="24" y1="144" x2="976" y2="144"/>
    <line class="rule" x1="24" y1="212" x2="976" y2="212"/>
    <line class="rule" x1="24" y1="280" x2="976" y2="280"/>
    <line class="rule" x1="704" y1="24" x2="704" y2="344"/>

    <text class="head" x="44" y="57">Hạng mục kiểm tra</text>
    <text class="head" x="724" y="57">Kết quả</text>

    <text class="cell" x="44" y="105">Máy chủ: kiểm tra định dạng và kiểu tĩnh</text>
    <text class="cell" x="44" y="125">trên 37 file cùng 172 bài kiểm thử</text>
    <text class="result" x="724" y="115">Đạt</text>

    <text class="cell" x="44" y="173">Giao diện: kiểm tra định dạng</text>
    <text class="result" x="724" y="183">Đạt</text>

    <text class="cell" x="44" y="241">API điểm kiểm tra sức khỏe trả mã 200</text>
    <text class="result" x="724" y="251">Đạt</text>

    <text class="cell" x="44" y="309">Ma trận nghiệm thu: 22 trên 22 đúng mã trạng thái</text>
    <text class="cell" x="44" y="329">với độ trễ từ 2,7 đến 25,5 giây</text>
    <text class="result" x="724" y="319">Đạt</text>

    <text class="note" x="24" y="400">Bốn hạng mục đều đạt yêu cầu kiểm tra đã định.</text>
    <text class="note" x="24" y="428">Số liệu độ trễ được ghi nhận trong ma trận nghiệm thu.</text>
  </svg>
</body>
</html>
