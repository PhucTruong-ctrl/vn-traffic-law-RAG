<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gộp nhiều danh sách kết quả bằng RRF</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .body { fill: #2d3142; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .rank { fill: #2d3142; font: 600 12px 'Be Vietnam Pro', sans-serif; }
    .formula { fill: #2d3142; font: 500 16px 'Be Vietnam Pro', sans-serif; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.9 RECIPROCAL RANK FUSION</p>
  <h1>Gộp nhiều danh sách kết quả bằng RRF</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-rrf-title ch2-rrf-desc">
    <title id="ch2-rrf-title">Gộp nhiều danh sách kết quả bằng RRF</title>
    <desc id="ch2-rrf-desc">Ba danh sách kết quả theo các truy vấn khác nhau được cộng điểm theo thứ hạng, gộp bằng RRF rồi giới hạn số chunk thuộc cùng văn bản, điều và khoản.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors before nodes. Each list enters RRF at a separate point. -->
    <path d="M264 120 H304 Q312 120 312 128 V212 Q312 220 320 220 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M264 268 H360" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M264 416 H304 Q312 416 312 408 V324 Q312 316 320 316 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="268" x2="620" y2="268" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="780" y1="268" x2="820" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Ranked list 1 -->
    <g>
      <rect x="40" y="52" width="224" height="136" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="52" width="224" height="136" rx="8" fill="#fff" stroke="#7a8399"/>
      <text x="56" y="76" class="tag">TRUY VẤN 1 · MỨC PHẠT</text>
      <text x="56" y="104" class="rank">1</text><text x="80" y="104" class="body">Chunk A</text>
      <text x="56" y="132" class="rank">2</text><text x="80" y="132" class="body">Chunk B</text>
      <text x="56" y="160" class="rank">3</text><text x="80" y="160" class="body">Chunk C</text>
    </g>

    <!-- Ranked list 2 -->
    <g>
      <rect x="40" y="200" width="224" height="136" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="200" width="224" height="136" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="56" y="224" class="tag">TRUY VẤN 2 · TRỪ ĐIỂM</text>
      <text x="56" y="252" class="rank">1</text><text x="80" y="252" class="body">Chunk B</text>
      <text x="56" y="280" class="rank">2</text><text x="80" y="280" class="body">Chunk A</text>
      <text x="56" y="308" class="rank">3</text><text x="80" y="308" class="body">Chunk D</text>
    </g>

    <!-- Ranked list 3 -->
    <g>
      <rect x="40" y="348" width="224" height="136" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="348" width="224" height="136" rx="8" fill="#fff" stroke="#7a8399"/>
      <text x="56" y="372" class="tag">TRUY VẤN 3 · TỪ KHÓA</text>
      <text x="56" y="400" class="rank">1</text><text x="80" y="400" class="body">Chunk C</text>
      <text x="56" y="428" class="rank">2</text><text x="80" y="428" class="body">Chunk B</text>
      <text x="56" y="456" class="rank">3</text><text x="80" y="456" class="body">Chunk A</text>
    </g>

    <!-- RRF fusion -->
    <g>
      <rect x="360" y="172" width="200" height="192" rx="8" fill="#f5f5f5"/>
      <rect x="360" y="172" width="200" height="192" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="376" y="196" class="tag">RRF · K = 60</text>
      <text x="460" y="228" class="name" text-anchor="middle">Cộng điểm theo hạng</text>
      <text x="460" y="260" class="body" text-anchor="middle">RRF(d) = Σ 1 /</text>
      <text x="460" y="280" class="body" text-anchor="middle">(60 + rank)</text>
      <line x1="384" y1="296" x2="536" y2="296" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <text x="460" y="320" class="sub" text-anchor="middle">Không dùng điểm số ban đầu</text>
      <text x="460" y="340" class="sub" text-anchor="middle">Lặp ở nhiều danh sách</text>
      <text x="460" y="356" class="sub" text-anchor="middle">thì tổng điểm tăng</text>
    </g>

    <!-- Diversity cap -->
    <g>
      <rect x="620" y="204" width="160" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="620" y="204" width="160" height="128" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="636" y="228" class="tag">GIỚI HẠN</text>
      <text x="700" y="256" class="name" text-anchor="middle">Tối đa 3 chunk</text>
      <text x="700" y="280" class="sub" text-anchor="middle">cùng văn bản</text>
      <text x="700" y="304" class="sub" text-anchor="middle">cùng điều, khoản</text>
    </g>

    <!-- Final ranking -->
    <g>
      <rect x="820" y="196" width="112" height="144" rx="8" fill="#f5f5f5"/>
      <rect x="820" y="196" width="112" height="144" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="836" y="220" class="tag">KẾT QUẢ</text>
      <text x="836" y="252" class="rank">1</text><text x="860" y="252" class="body">B</text>
      <text x="836" y="280" class="rank">2</text><text x="860" y="280" class="body">A</text>
      <text x="836" y="308" class="rank">3</text><text x="860" y="308" class="body">C</text>
    </g>

    <rect x="360" y="396" width="420" height="72" rx="8" fill="rgba(45,49,66,.025)" stroke="#7a8399" stroke-dasharray="4,3"/>
    <text x="376" y="420" class="tag">CÁCH ĐỌC</text>
    <text x="570" y="444" class="sub" text-anchor="middle">Chunk B có hạng cao trong cả ba danh sách.</text>
    <text x="570" y="460" class="sub" text-anchor="middle">Tổng điểm RRF đưa B lên đầu.</text>

    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="548" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="532" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="164" y="544" class="legend">ĐIỂM GỘP RRF</text>
    <line x1="320" y1="540" x2="364" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="376" y="544" class="legend">DÒNG DANH SÁCH XẾP HẠNG</text>
    <rect x="640" y="532" width="20" height="16" rx="4" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
    <text x="672" y="544" class="legend">GIỚI HẠN TRÙNG NHÓM PHÁP LÝ</text>
    <text x="920" y="584" class="legend" text-anchor="end">HÌNH 2.10 · RRF</text>
  </svg>
</main>
</body>
</html>
