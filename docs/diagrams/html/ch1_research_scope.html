<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phạm vi nghiên cứu</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;width:1000px;height:620px;overflow:hidden;background:#f5f5f5;color:#2d3142;font-family:'Be Vietnam Pro',sans-serif}svg{display:block;width:1000px;height:620px}.t{font-family:'Be Vietnam Pro',sans-serif;fill:#2d3142}.m{font-family:'Be Vietnam Pro',sans-serif;fill:#4f5d75}.name{font-size:16px;font-weight:600}.body{font-size:12px}.accent{fill:#eb6c36}.link{stroke:#2e5aa8;stroke-width:2;fill:none}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="diagram-research-scope-title diagram-research-scope-desc"><title id="diagram-research-scope-title">Phạm vi nghiên cứu</title><desc id="diagram-research-scope-desc">17 văn bản, 40 trường hợp và 5 nhóm chức năng.</desc><rect width="1000" height="620" fill="#f5f5f5"/><rect x="48" y="56" width="904" height="164" rx="8" fill="#fff" stroke="#2d3142" stroke-width="2"/><text x="76" y="96" class="t name">17 văn bản trong danh mục nguồn</text><text x="76" y="132" class="m body">Luật, nghị định, thông tư và văn bản hướng dẫn</text><text x="76" y="160" class="m body">được chọn theo hiệu lực và phạm vi giao thông đường bộ.</text><rect x="48" y="248" width="904" height="164" rx="8" fill="#fff" stroke="#2e5aa8" stroke-width="2"/><text x="76" y="288" class="t name">40 trường hợp chia 8 nhóm</text><text x="76" y="324" class="m body">Vi phạm, điều kiện áp dụng, mức phạt và biện pháp xử lý.</text><text x="76" y="352" class="m body">Mỗi nhóm có ví dụ kiểm tra và căn cứ tương ứng.</text><rect x="48" y="440" width="904" height="124" rx="8" fill="#fff" stroke="#eb6c36" stroke-width="2"/><rect x="48" y="440" width="10" height="124" rx="6" class="accent"/><text x="76" y="480" class="t name">5 nhóm chức năng ứng dụng<
