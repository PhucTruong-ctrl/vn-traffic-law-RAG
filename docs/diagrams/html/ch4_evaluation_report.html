<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1000">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1000px; height: 620px; margin: 0; overflow: hidden; }
    body { background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 1000px; height: 620px; }
    .label { fill: #2d3142; font-size: 12px; font-weight: 500; }
    .value { fill: #2d3142; font-size: 12px; font-weight: 600; }
    .note { fill: #4f5d75; font-size: 10px; font-weight: 400; }
    .grid { stroke: rgba(45,49,66,.14); stroke-width: 1; }
    .bar { fill: #2e5aa8; }
    .zero { fill: #eb6c36; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Các chỉ số đánh giá</title>
    <desc id="diagram-desc">Biểu đồ cột ngang gồm bảy chỉ số đánh giá và ba ghi chú về tập dữ liệu, độ trễ và việc chấm điểm.</desc>
    <g aria-hidden="true">
      <line class="grid" x1="392" y1="32" x2="392" y2="432"/>
      <line class="grid" x1="512" y1="32" x2="512" y2="432"/>
      <line class="grid" x1="632" y1="32" x2="632" y2="432"/>
      <line class="grid" x1="752" y1="32" x2="752" y2="432"/>
      <line class="grid" x1="872" y1="32" x2="872" y2="432"/>
      <line class="grid" x1="992" y1="32" x2="992" y2="432"/>
    </g>
    <g>
      <text class="label" x="24" y="59">Tìm thấy căn cứ đúng trong top k</text>
      <rect class="bar" x="392" y="42" width="150" height="28" rx="6"/>
      <text class="value" x="550" y="61">0,25</text>

      <text class="label" x="24" y="115">Độ chính xác ở mức văn bản</text>
      <rect class="bar" x="392" y="98" width="300" height="28" rx="6"/>
      <text class="value" x="700" y="117">0,50</text>

      <text class="label" x="24" y="171">Độ chính xác ở mức Điều</text>
      <rect class="bar" x="392" y="154" width="250" height="28" rx="6"/>
      <text class="value" x="650" y="173">0,4167</text>

      <text class="label" x="24" y="227">Độ chính xác ở mức Khoản</text>
      <rect class="bar" x="392" y="210" width="231" height="28" rx="6"/>
      <text class="value" x="631" y="229">0,3846</text>

      <text class="label" x="24" y="283">Độ chính xác ở mức Điểm</text>
      <rect class="zero" x="392" y="266" width="6" height="28" rx="3"/>
      <text class="value" x="408" y="285">0,0</text>

      <text class="label" x="24" y="339">Tỉ lệ trích dẫn hợp lệ</text>
      <rect class="bar" x="392" y="322" width="529" height="28" rx="6"/>
      <text class="value" x="929" y="341">0,8824</text>

      <text class="label" x="24" y="395">Tỉ lệ từ chối trả lời đúng</text>
      <rect class="bar" x="392" y="378" width="424" height="28" rx="6"/>
      <text class="value" x="824" y="397">0,7059</text>
    </g>
    <g>
      <text class="note" x="24" y="480">40 trường hợp; 34 trường hợp được tính; 6 trường hợp loại vì dữ liệu chưa bao phủ.</text>
      <text class="note" x="24" y="508">Độ trễ trung bình 8304,6 ms; trung vị 8359,09 ms; phân vị 95 là 11577,15 ms.</text>
      <text class="note" x="24" y="536">Nội dung trả lời chưa chấm thủ công.</text>
    </g>
  </svg>
</body>
</html>
