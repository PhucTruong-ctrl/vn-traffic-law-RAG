<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu định danh pháp lý chính xác</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Be Vietnam Pro', sans-serif; }
    .page { width: min(960px, 100%); margin: auto; padding: 32px 40px 24px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .16em; }
    h1 { margin: 0 0 24px; font: 400 28px/1.15 'Be Vietnam Pro', sans-serif; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: #2d3142; font: 600 16px 'Be Vietnam Pro', sans-serif; }
    .sub { fill: #4f5d75; font: 400 12px 'Be Vietnam Pro', sans-serif; }
    .tag { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; }
    .branch { fill: #4f5d75; font: 500 12px 'Be Vietnam Pro', sans-serif; }
    .legend { fill: #4f5d75; font: 500 8px 'Be Vietnam Pro', sans-serif; letter-spacing: .06em; }
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CHƯƠNG 2 · 2.4 TRA CỨU ĐỊNH DANH PHÁP LÝ</p>
  <h1>Tra cứu chính xác số hiệu văn bản, Điều, Khoản và Điểm</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-exact-lookup-title ch2-exact-lookup-desc">
    <title id="ch2-exact-lookup-title">Tra cứu định danh pháp lý chính xác</title>
    <desc id="ch2-exact-lookup-desc">Hệ thống tách định danh từ câu hỏi, tạo bộ lọc Qdrant và chạy similarity search. Nếu kết quả chưa đủ, Qdrant scroll tìm thêm chunk khớp metadata.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>

    <rect width="960" height="600" fill="#f5f5f5"/>

    <!-- Connectors before nodes. -->
    <line x1="220" y1="112" x2="272" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="464" y1="112" x2="516" y2="112" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="708" y1="112" x2="760" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M840 176 V208 Q840 216 832 216 H628 Q620 216 620 224 V252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M620 316 V344 Q620 352 612 352 H464 Q456 352 456 360 V392" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M684 284 H748 Q756 284 756 292 V416 Q756 424 748 424 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="456" y1="456" x2="508" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Branch labels. -->
    <rect x="696" y="256" width="40" height="16" rx="4" fill="#f5f5f5"/>
    <text x="716" y="268" class="branch" text-anchor="middle">Đủ</text>
    <rect x="568" y="328" width="48" height="16" rx="4" fill="#f5f5f5"/>
    <text x="592" y="340" class="branch" text-anchor="middle">Thiếu</text>

    <!-- Input -->
    <g>
      <rect x="40" y="48" width="180" height="128" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="48" width="180" height="128" rx="20" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="56" y="72" class="tag">CÂU HỎI</text>
      <text x="130" y="104" class="name" text-anchor="middle">Khoản 2 Điều 7</text>
      <text x="130" y="128" class="sub" text-anchor="middle">Nghị định 168/2024/NĐ-CP</text>
      <text x="130" y="152" class="sub" text-anchor="middle">Có đủ định danh</text>
    </g>

    <!-- Parse reference -->
    <g>
      <rect x="272" y="48" width="192" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="272" y="48" width="192" height="128" rx="8" fill="#fff" stroke="#2d3142"/>
      <text x="288" y="72" class="tag">REGEX</text>
      <text x="368" y="104" class="name" text-anchor="middle">Tách định danh</text>
      <text x="288" y="132" class="sub">article · clause · point</text>
      <text x="288" y="156" class="sub">document_number</text>
    </g>

    <!-- Filter -->
    <g>
      <rect x="516" y="48" width="192" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="516" y="48" width="192" height="128" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="532" y="72" class="tag">PAYLOAD FILTER</text>
      <text x="612" y="104" class="name" text-anchor="middle">Lọc metadata</text>
      <text x="532" y="132" class="sub">metadata.article = 7</text>
      <text x="532" y="156" class="sub">metadata.clause = 2</text>
    </g>

    <!-- Similarity search -->
    <g>
      <rect x="760" y="48" width="168" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="760" y="48" width="168" height="128" rx="8" fill="#fff" stroke="#2e5aa8"/>
      <text x="776" y="72" class="tag">QDRANT</text>
      <text x="844" y="104" class="name" text-anchor="middle">Similarity search</text>
      <text x="776" y="132" class="sub">query + payload filter</text>
      <text x="776" y="156" class="sub">lấy các chunk phù hợp</text>
    </g>

    <!-- Decision -->
    <polygon points="620,252 684,284 620,316 556,284" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="620" y="280" class="sub" text-anchor="middle">Đủ đoạn</text>
    <text x="620" y="296" class="sub" text-anchor="middle">khớp?</text>

    <!-- Fallback -->
    <g>
      <rect x="276" y="392" width="180" height="128" rx="8" fill="#f5f5f5"/>
      <rect x="276" y="392" width="180" height="128" rx="8" fill="rgba(45,49,66,.03)" stroke="#4f5d75" stroke-dasharray="4,4"/>
      <text x="292" y="416" class="tag">DỰ PHÒNG</text>
      <text x="366" y="448" class="name" text-anchor="middle">Qdrant scroll</text>
      <text x="292" y="476" class="sub">lọc trực tiếp theo metadata</text>
      <text x="292" y="500" class="sub">tìm thêm đoạn còn thiếu</text>
    </g>

    <!-- Exact result -->
    <g>
      <rect x="508" y="392" width="140" height="128" rx="20" fill="#f5f5f5"/>
      <rect x="508" y="392" width="140" height="128" rx="20" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="524" y="416" class="tag">KẾT QUẢ</text>
      <text x="578" y="448" class="name" text-anchor="middle">Đúng đoạn</text>
      <text x="578" y="476" class="sub" text-anchor="middle">đúng văn bản</text>
      <text x="578" y="500" class="sub" text-anchor="middle">Điều · Khoản · Điểm</text>
    </g>

    <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="576" class="legend">CHÚ GIẢ</text>
    <rect x="132" y="560" width="20" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
    <text x="164" y="572" class="legend">ĐỊNH DANH CHÍNH XÁC</text>
    <rect x="372" y="560" width="20" height="16" rx="4" fill="rgba(45,49,66,.03)" stroke="#4f5d75" stroke-dasharray="4,4"/>
    <text x="404" y="572" class="legend">ĐƯỜNG DỰ PHÒNG</text>
    <line x1="588" y1="568" x2="632" y2="568" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="644" y="572" class="legend">TRUY VẤN QDRANT</text>
  </svg>
</main>
</body>
</html>
