[project]
name = "vnlaw-backend"
version = "0.1.0"
description = "VNLaw controlled-workflow RAG backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]",
    "pydantic[email]>=2.7.4",
    "pydantic-settings",
    "langchain-openai>=1,<2",
    "langchain-openrouter>=0.1,<1",
    "langchain-qdrant>=1,<2",
    "openai>=2,<3",
    "qdrant-client>=1.19",
    "fastembed>=0.7,<1",
    "supabase>=2,<3",
    "onnxruntime<1.24",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "playwright",
    "jsonschema",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.uv]
environments = ["sys_platform == 'linux'"]
