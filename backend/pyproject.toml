[project]
name = "vnlaw-backend"
version = "0.1.0"
description = "VNLaw controlled-workflow RAG backend: ingestion, retrieval, workflow orchestration, evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]",
    "pydantic>=2.7.4",
    "pydantic-settings",
    "langgraph>=1.1",
    "langchain-core>=1.3.0,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3",
    "qdrant-client>=1.19",
    "redis>=5,<6",
    "dramatiq==2.2.0",
    "minio>=7",
    "langfuse>=4.7.0",
    "google-genai",
    "openai",
    "docling==2.118.1",
    "mineru[pipeline]>=3.4,<3.5",
    "ragas==0.4.3",
    "jinja2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "playwright",
    "types-redis",
    "httpx",
    "jsonschema",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
