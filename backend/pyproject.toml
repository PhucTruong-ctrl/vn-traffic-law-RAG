[project]
name = "vnlaw-backend"
version = "0.1.0"
description = "VNLaw controlled-workflow RAG backend: ingestion, retrieval, workflow orchestration, evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]",
    "pydantic>=2.7.4",
    "pydantic-settings",
    "langgraph>=1.1",
    "langchain-core>=1.3.0,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3",
    "qdrant-client>=1.19",
    "redis>=5,<6",
    "dramatiq==2.2.0",
    "minio>=7",
    "langfuse>=4.7.0",
    "google-genai",
    "httpx>=0.27,<1",
    "docling==2.118.1",
    "paddlepaddle-gpu==3.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "paddlepaddle==3.2.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "paddleocr==3.3.0",
    "mineru>=3.4,<3.5",
    "jinja2",
    "pdfplumber>=0.11,<1",
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
evaluation = ["ragas==0.4.3"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "playwright",
    "types-redis",
    "jsonschema",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: real external-tool integration tests (require MINERU_INTEGRATION=1)",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
