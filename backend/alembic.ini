# =============================================================================
# VNLRAG Alembic configuration (backend)
# =============================================================================
# The schema is managed exclusively by Alembic (doc 07 §7.8.1, doc 08 §8.6.1);
# the one-shot `migrate` service runs `alembic upgrade head` (doc 07 §7.2.2).
#
# sqlalchemy.url is intentionally NOT configured here: env.py resolves the
# database URL conventionally — explicit config override (tests), then the
# DATABASE_URL environment variable, then the repository-root `.env` file
# (doc 07 §7.3.3) — mirroring `app.config.Settings`.
# =============================================================================

[alembic]
# Path to the migration environment; %(here)s resolves to this file's directory
# so invocations work from any cwd (one-shot service, CI, tests).
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# version_locations / version_path_separator: not needed for the initial
# migration; Alembic defaults to <script_location>/versions.

# Logging configuration (standard Alembic template).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
